name: Geometry and source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  geometry:
    name: Independent geometry and source validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: /tmp/kresling-matplotlib
      XDG_CACHE_HOME: /tmp/kresling-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install -r requirements-validation.txt
      - name: Check source structure and globally unique parameter IDs
        run: python check_featurescript_source.py
      - name: Verify existing geometry regression cases
        run: python verify_geometry.py
      - name: Verify manufacturing solids, seam refinements and material partitioning
        run: python -m unittest verify_manufacturing verify_refinements -v
